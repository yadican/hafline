name: hafline

networks:
  hafline:
    name: hafline

services:
  app:
    image: hafline-app:latest
    build:
      context: ./docker/php
    container_name: hafline-app
    networks: [hafline]
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./htdocs:/var/www/html
      - ./data:/var/www/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Runs Laravel's schedule (e.g. hauls:prune-scans hourly).
  scheduler:
    image: hafline-app:latest
    container_name: hafline-scheduler
    networks: [hafline]
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./htdocs:/var/www/html
      - ./data:/var/www/data
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    image: nginx:1.28-alpine
    container_name: hafline-web
    networks: [hafline]
    ports:
      - "8010:80"
    volumes:
      - ./htdocs:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:latest
    container_name: hafline-postgres
    networks: [hafline]
    # JIT compile time exceeds execution time for this app's short OLTP queries.
    command: ["postgres", "-c", "jit=off"]
    environment:
      POSTGRES_DB: hafline
      POSTGRES_USER: hafline
      POSTGRES_PASSWORD: hafline
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hafline -d hafline"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Günlük 2 yedek (00:00 / 12:00 TR) → ./backups, 90 günden eski silinir.
  db_backup:
    image: postgres:latest
    container_name: hafline-db-backup
    networks: [hafline]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: hafline
      PGPASSWORD: hafline
      PGDATABASE: hafline
      KEEP_DAYS: "90"
      TZ: Europe/Istanbul
    volumes:
      - ./backups:/backup
      - ./docker/scripts/db-backup.sh:/db-backup.sh:ro
    entrypoint: ["/bin/bash", "/db-backup.sh"]
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: hafline-redis
    networks: [hafline]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
